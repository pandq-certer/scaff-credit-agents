<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能信贷数字员工</title>
<style>
  :root {
    --pri:#4d6bfe; --pri-weak:#eef2ff; --bg:#f7f8fa; --panel:#fff;
    --line:#ececf1; --txt:#1f2329; --sub:#8a8f99; --ok:#00b578;
    --warn:#ff8f1f; --err:#f53f3f; --radius:16px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); overflow:hidden; }

  /* ===== 整体布局：侧栏 + 对话主区 + 日志抽屉 ===== */
  #app { display:flex; height:100vh; }

  /* 左侧导航 */
  #side { width:232px; flex:0 0 232px; background:#f9fafc; border-right:1px solid var(--line);
          display:flex; flex-direction:column; padding:14px 12px; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 6px 10px; }
  .brand .logo { width:32px; height:32px; border-radius:10px; flex:0 0 32px;
                 background:linear-gradient(135deg,#4d6bfe,#8a5cff); display:flex; align-items:center; justify-content:center; }
  .brand .logo svg { width:18px; height:18px; }
  .brand b { font-size:15px; letter-spacing:.5px; }
  #newchat { display:flex; align-items:center; justify-content:center; gap:6px;
             background:var(--pri); color:#fff; border:none; border-radius:12px;
             padding:10px 0; font-size:14px; font-weight:600; cursor:pointer; transition:.2s; }
  #newchat:hover { filter:brightness(1.08); }
  #famlist { flex:1; overflow-y:auto; margin-top:4px; }
  /* 历史对话 */
  #histsec { max-height:168px; display:flex; flex-direction:column; margin-top:4px; }
  #histsec .cap { font-size:11px; color:var(--sub); padding:8px 8px 4px; letter-spacing:1px; flex:0 0 auto; }
  #histlist { overflow-y:auto; min-height:0; }
  #histlist .hempty { font-size:11.5px; color:#c0c4cc; padding:6px 8px; }
  .hitem { position:relative; padding:7px 10px; border-radius:10px; cursor:pointer; transition:.15s; }
  .hitem:hover { background:var(--pri-weak); }
  .hitem b { display:block; font-size:12.5px; font-weight:500; color:#3c414b; padding-right:24px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hitem:hover b { color:var(--pri); }
  .hitem span { display:block; font-size:10.5px; color:var(--sub); margin-top:2px; }
  .hdel { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:22px; height:22px;
          border:none; background:transparent; border-radius:6px; cursor:pointer; color:var(--sub);
          display:none; align-items:center; justify-content:center; transition:.12s; }
  .hitem:hover .hdel { display:flex; }
  .hdel:hover { background:#fdecec; color:var(--err); }
  .hdel svg { width:12px; height:12px; }
  #famlist .cap { font-size:11px; color:var(--sub); padding:8px 8px 4px; letter-spacing:1px; }
  .fam { display:flex; justify-content:space-between; align-items:center; padding:8px 10px;
         border-radius:10px; font-size:13px; cursor:pointer; color:#3c414b; transition:.15s; }
  .fam:hover { background:var(--pri-weak); color:var(--pri); }
  .fam .fname { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
  .fam .fname::before { content:''; flex:0 0 5px; width:5px; height:5px; margin-top:-2px;
                        border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor;
                        transform:rotate(-45deg); transition:.2s; opacity:.45; }
  .fam.open .fname::before { transform:rotate(45deg); margin-top:2px; }
  .fam .n { font-size:11px; color:var(--sub); background:#eef0f4; border-radius:8px; padding:1px 7px; }
  .fam:hover .n { background:#fff; }
  .sub { display:none; margin:2px 0 4px; padding-left:14px; }
  .subitem { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:8px;
             font-size:12px; color:#5a5f6a; cursor:pointer; transition:.12s; min-width:0; }
  .subitem:hover { background:var(--pri-weak); color:var(--pri); }
  .subitem i { font-style:normal; flex:0 0 auto; font-size:10.5px; color:var(--sub); background:#eef0f4;
               border-radius:6px; padding:1px 5px; font-variant-numeric:tabular-nums; }
  .subitem:hover i { background:#fff; color:var(--pri); }
  .subitem em { font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #side .foot { font-size:11px; color:var(--sub); padding:8px 6px; line-height:1.7; border-top:1px solid var(--line); }

  /* 对话主区 */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  #topbar { height:52px; flex:0 0 52px; display:flex; align-items:center; padding:0 20px;
            background:transparent; font-size:13px; color:var(--sub); gap:10px; }
  #topbar b { color:var(--txt); font-size:14px; }
  #topbar .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }

  /* 欢迎态 */
  #welcome { position:absolute; inset:52px 0 118px; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:18px; padding:0 24px;
             transition:opacity .3s; }
  body.started #welcome { display:none; }
  #welcome .halo { width:64px; height:64px; border-radius:20px;
                   background:linear-gradient(135deg,#4d6bfe,#8a5cff);
                   display:flex; align-items:center; justify-content:center;
                   box-shadow:0 12px 32px rgba(77,107,254,.28); animation:pop .5s ease; }
  #welcome .halo svg { width:34px; height:34px; }
  #welcome h1 { font-size:24px; font-weight:700; letter-spacing:.5px; }
  #welcome p { font-size:13.5px; color:var(--sub); }
  #scenes { font-size:12px; color:var(--sub); background:#fff; border:1px solid var(--line);
            border-radius:999px; padding:6px 16px; }
  #sug { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:min(640px,100%); margin-top:6px; }
  .sug { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
         font-size:13px; color:#3c414b; cursor:pointer; text-align:left; transition:.18s;
         line-height:1.5; animation:rise .45s ease backwards; }
  .sug:hover { border-color:var(--pri); color:var(--pri); transform:translateY(-2px);
               box-shadow:0 6px 18px rgba(77,107,254,.10); }
  .sug span { display:block; font-size:11px; color:var(--sub); margin-top:4px; }
  .sug:hover span { color:var(--pri); opacity:.75; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes rise { from { transform:translateY(10px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  /* 对话流 */
  #chat { flex:1; overflow-y:auto; padding:8px 0 16px; display:flex; flex-direction:column; gap:20px; scroll-behavior:smooth; }
  .row { display:flex; gap:10px; padding:0 24px; max-width:860px; margin:0 auto; width:100%;
         animation:rise .3s ease; }
  .row.user { justify-content:flex-end; }
  .avatar { width:30px; height:30px; flex:0 0 30px; border-radius:9px; margin-top:2px;
            background:linear-gradient(135deg,#4d6bfe,#8a5cff);
            display:flex; align-items:center; justify-content:center; }
  .avatar svg { width:16px; height:16px; }
  .msg { max-width:78%; padding:11px 15px; border-radius:16px; line-height:1.7;
         font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .row.user .msg { background:var(--pri); color:#fff; border-bottom-right-radius:6px; }
  .row.bot { align-items:flex-start; }
  .row.bot .msg { background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px; }
  .row.hint { justify-content:center; }
  .row.hint .msg { background:transparent; color:var(--sub); font-size:12px; padding:0; max-width:92%; text-align:center; }
  /* 结果分块：嵌入对话流的浅色面板 */
  .row.card { align-items:flex-start; }
  .row.card .msg { max-width:86%; background:#fff; border:1px solid var(--line); border-radius:16px;
                   padding:14px 18px 12px; box-shadow:0 4px 20px rgba(31,35,41,.05); }
  .row.card b { display:block; font-size:13px; color:var(--pri); margin:14px 0 6px; display:flex; align-items:center; gap:6px; }
  .row.card b:first-child { margin-top:0; }
  .row.card b::before { content:''; width:3px; height:12px; border-radius:2px; background:var(--pri); }
  .row.card li { list-style:none; font-size:13.5px; line-height:1.8; color:#333; }
  .row.card li.num { font-weight:600; color:var(--pri); }
  /* KV 键值行 */
  .kvrow { display:flex; padding:5px 0; font-size:13.5px; line-height:1.7; border-bottom:1px dashed #f0f1f5; }
  .kvrow:last-child { border-bottom:none; }
  .kvrow .k { flex:0 0 96px; color:var(--sub); }
  .kvrow .v { flex:1; color:#1f2329; font-weight:500; }
  .kvrow .v.hl { color:var(--pri); font-weight:700; font-variant-numeric:tabular-nums; }
  /* 结果表格 */
  .ptable { width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:12.5px; }
  .ptable th { background:var(--pri-weak); color:#33418f; font-weight:600; padding:7px 10px; text-align:right; white-space:nowrap; }
  .ptable th:first-child { text-align:center; border-radius:8px 0 0 0; }
  .ptable th:last-child { border-radius:0 8px 0 0; }
  .ptable td { padding:6px 10px; border-bottom:1px solid #f0f1f5; text-align:right; color:#333; font-variant-numeric:tabular-nums; }
  .ptable td:first-child { text-align:center; color:var(--sub); }
  .ptable tr:hover td { background:#f8faff; }
  /* 状态徽章 */
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
           border-radius:999px; padding:3px 12px; margin:4px 0; }
  .badge.ok { background:#e8f8f2; color:var(--ok); }
  .badge.bad { background:#fdecec; color:var(--err); }
  /* 图表化分块 */
  .barchart { margin:6px 0 4px; }
  .barchart .brow { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.5px; }
  .barchart .brow .bl { flex:0 0 108px; color:var(--sub); text-align:right; overflow:hidden;
                        text-overflow:ellipsis; white-space:nowrap; }
  .barchart .brow .btrack { flex:1; height:14px; background:#f2f4f9; border-radius:7px; overflow:hidden; }
  .barchart .brow .bfill { height:100%; border-radius:7px; min-width:3px;
                           background:linear-gradient(90deg,#4d6bfe,#8a5cff); transition:width .6s ease; }
  .barchart .brow .bv { flex:0 0 92px; color:#1f2329; font-weight:600; font-variant-numeric:tabular-nums; }
  .barchart .brow.neg .bfill { background:linear-gradient(90deg,#ff7d4d,#ff4d4f); }
  .donutwrap { display:flex; align-items:center; gap:18px; margin:8px 0 4px; }
  .graphbox { margin:8px 0 4px; padding:10px 8px 6px; background:#fafbfc; border:1px solid #e5e6eb; border-radius:8px; overflow-x:auto; }
  .graphhint { margin-top:6px; font-size:11px; color:#86909c; }
  .donutwrap svg { flex:0 0 128px; }
  .donutwrap .dcenter { font-size:15px; font-weight:700; fill:#1f2329; }
  .dlegend { flex:1; font-size:12.5px; }
  .dlegend .lrow { display:flex; align-items:center; gap:7px; padding:3px 0; color:#333; }
  .dlegend .dot { width:9px; height:9px; border-radius:3px; flex:0 0 9px; }
  .dlegend .lname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dlegend .lval { font-weight:600; color:#1f2329; font-variant-numeric:tabular-nums; }
  .progrow { padding:6px 0; font-size:12.5px; }
  .progrow .plabel { display:flex; justify-content:space-between; margin-bottom:4px; }
  .progrow .plabel .pn { color:var(--sub); }
  .progrow .plabel .pv { color:#1f2329; font-weight:600; font-variant-numeric:tabular-nums; }
  .progrow .ptrack { height:8px; background:#f2f4f9; border-radius:4px; overflow:hidden; }
  .progrow .pfill { height:100%; border-radius:4px; transition:width .6s ease;
                    background:linear-gradient(90deg,#4d6bfe,#69b4ff); }
  .progrow.warn .pfill { background:linear-gradient(90deg,#ff9f43,#ffd166); }
  .progrow.fail .pfill { background:linear-gradient(90deg,#ff6b6b,#ff4d4f); }
  .stlist { margin:6px 0 2px; }
  .stlist .srow { display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:13px;
                  border-bottom:1px dashed #f0f1f5; }
  .stlist .srow:last-child { border-bottom:none; }
  .stlist .sic { flex:0 0 17px; height:17px; border-radius:50%; margin-top:2px; color:#fff;
                 font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .stlist .ok .sic { background:var(--ok); } .stlist .warn .sic { background:var(--warn); }
  .stlist .fail .sic { background:var(--err); }
  .stlist .slabel { font-weight:600; color:#1f2329; flex:0 0 auto; }
  .stlist .snote { color:var(--sub); font-size:12px; }
  /* 确认卡片 */
  .ccard { flex:1; max-width:86%; background:#fff; border:1px solid #ffd8a8; border-radius:16px;
           overflow:hidden; box-shadow:0 4px 20px rgba(255,143,31,.10); animation:rise .3s ease; }
  .ccard .h { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg,#fff7ed,#fffdfa);
              padding:10px 16px; font-size:13px; font-weight:700; color:#b35900; }
  .ccard .h .ic { width:18px; height:18px; border-radius:50%; background:var(--warn); color:#fff;
                  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
                  animation:pulse 1.6s ease infinite; }
  .ccard .b { padding:12px 16px 4px; font-size:13.5px; line-height:1.75; white-space:pre-wrap; color:#333; }
  .ccard .f { display:flex; gap:8px; padding:12px 16px 14px; }
  .ccard .f button { flex:1; padding:9px 0; border-radius:10px; font-size:13.5px; font-weight:600;
                     cursor:pointer; transition:.15s; border:1px solid var(--line); background:#fff; color:#3c414b; }
  .ccard .f button:hover { border-color:var(--pri); color:var(--pri); background:var(--pri-weak); }
  .ccard .f button.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
  .ccard .f button.pri:hover { filter:brightness(1.08); color:#fff; }
  .ccard .f button:disabled { opacity:.45; cursor:not-allowed; }
  /* 场景开场白卡片：提示词库 opening 引导，每场景每会话仅出现一次 */
  .ocard { flex:1; max-width:86%; background:#fff; border:1px solid #c6d3ff; border-radius:16px;
           overflow:hidden; box-shadow:0 4px 20px rgba(77,107,254,.10); animation:rise .3s ease; }
  .ocard .h { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg,#eef2ff,#f8faff);
              padding:10px 16px; font-size:13px; font-weight:700; color:#3450c8; }
  .ocard .h .ic { width:18px; height:18px; border-radius:50%; background:var(--pri); color:#fff;
                  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
  .ocard .h .sid { font-size:12px; font-weight:600; color:#8a94c8; }
  .ocard .b { padding:12px 16px 4px; font-size:13.5px; line-height:1.75; white-space:pre-wrap; color:#333; }
  .ocard .f { display:flex; gap:8px; padding:12px 16px 14px; flex-wrap:wrap; }
  .ocard .f button { padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600;
                     cursor:pointer; transition:.15s; border:1px solid var(--line); background:#fff; color:#3c414b; }
  .ocard .f button:hover { border-color:var(--pri); color:var(--pri); background:var(--pri-weak); }
  /* 打字指示 */
  .typing { display:flex; gap:5px; padding:14px 16px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:#c3c9d4; animation:blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,60%,100% { opacity:.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }

  /* 底部输入区 */
  #dock { flex:0 0 auto; padding:0 24px 14px; }
  #dockinner { max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  #statebar { display:none; align-self:flex-start; align-items:center; gap:8px;
              background:#fff7ed; border:1px solid #ffd8a8; color:#b35900;
              font-size:13px; font-weight:600; border-radius:999px; padding:7px 16px;
              animation:pulse 1.8s ease infinite; }
  #statebar small { font-weight:400; color:var(--sub); }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,143,31,.25); } 50% { box-shadow:0 0 0 6px rgba(255,143,31,0); } }
  #quick { display:flex; gap:8px; flex-wrap:wrap; }
  #quick button { background:#fff; border:1px solid var(--line); color:#3c414b;
                  padding:6px 14px; font-size:12.5px; border-radius:999px; cursor:pointer; transition:.15s; }
  #quick button:hover { border-color:var(--pri); color:var(--pri); background:var(--pri-weak); }
  #quick.confirm button { background:#fff7ed; border-color:#ffd8a8; color:#b35900; font-weight:600; font-size:13px; padding:7px 16px; }
  #quick.confirm button:hover { background:#ffeccc; color:#8a4500; }
  #inputbox { display:flex; align-items:flex-end; gap:10px; background:#fff; border:1.5px solid var(--line);
              border-radius:24px; padding:10px 10px 10px 18px; transition:.2s; box-shadow:0 2px 12px rgba(31,35,41,.04); }
  #inputbox:focus-within { border-color:var(--pri); box-shadow:0 0 0 4px rgba(77,107,254,.10); }
  #input { flex:1; border:none; outline:none; resize:none; font-size:14.5px; line-height:1.6;
           font-family:inherit; background:transparent; max-height:120px; padding:4px 0; color:var(--txt); }
  #input::placeholder { color:#b8bdc9; }
  #send { width:36px; height:36px; flex:0 0 36px; border:none; border-radius:50%;
          background:var(--pri); color:#fff; cursor:pointer; display:flex; align-items:center;
          justify-content:center; transition:.2s; }
  #send:hover { filter:brightness(1.1); }
  #send:disabled { background:#d4d8e1; cursor:not-allowed; }
  #send svg { width:16px; height:16px; }
  /* 文件上传区（1.3.1/1.3.2 硬规范）：附件按钮 + 拖拽遮罩 + 上传气泡 */
  #attach { width:36px; height:36px; flex:0 0 36px; border:none; border-radius:50%; background:transparent;
            color:#9aa0ad; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; margin-bottom:2px; }
  #attach:hover { background:var(--pri-weak); color:var(--pri); }
  #attach svg { width:18px; height:18px; }
  #attach.busy { color:var(--pri); animation:blink 1.2s infinite; }
  .dropmask { position:fixed; inset:0; z-index:900; background:rgba(77,107,254,.08);
              display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .dropmask span { background:#fff; border:2px dashed var(--pri); color:var(--pri); font-size:14px; font-weight:600;
                   border-radius:16px; padding:18px 32px; box-shadow:0 12px 40px rgba(77,107,254,.18); }
  .ufile { display:inline-flex; align-items:center; gap:6px; }
  .ufile svg { width:14px; height:14px; flex:0 0 14px; }
  .ufile.up { opacity:.6; }
  /* 统一入口分发徽标条：标注消息经 S10-1 入口解析分发 */
  .etag { display:inline-flex; align-items:center; gap:5px; margin:0 0 7px; padding:3px 10px;
          border-radius:999px; font-size:11px; font-weight:600; color:#3450c8;
          background:linear-gradient(90deg,#eef2ff,#f8faff); border:1px solid #c6d3ff; }
  .etag svg { opacity:.65; flex:0 0 11px; }

  /* 右侧链路抽屉：上图形（DAG 链路图）+ 下文字（滚动日志）双区 */
  #logpanel { width:0; flex:0 0 0; background:#fbfbfd; border-left:1px solid transparent;
              display:flex; flex-direction:column; overflow:hidden; transition:width .25s ease, flex-basis .25s ease; }
  body.logopen #logpanel { width:400px; flex-basis:400px; border-left-color:var(--line); }
  #logpanel h3 { font-size:12.5px; color:var(--sub); padding:14px 16px 10px; display:flex;
                 align-items:center; justify-content:space-between; white-space:nowrap; }
  #logpanel h3 .mini { background:none; border:none; color:var(--pri); font-size:12px; cursor:pointer; }
  /* 图形区：git-graph 风格纵向脊柱线 + 分层胶囊节点 */
  #dag { flex:0 1 auto; max-height:48%; overflow-y:auto; padding:4px 14px 8px; }
  .layer { position:relative; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:5px 0 5px 30px; }
  .layer::before { content:''; position:absolute; left:10px; top:-7px; bottom:-7px; width:2px; background:#dfe3ee; border-radius:1px; }
  .layer:first-child::before { top:50%; }
  .layer:last-child::before { bottom:50%; }
  .layer::after { content:''; position:absolute; left:6px; top:50%; transform:translateY(-50%); width:9px; height:9px;
                  border-radius:50%; background:#fff; border:2px solid #b9c3dc; z-index:1; transition:.2s; }
  .layer:has(.nd.run)::after { border-color:var(--pri); }
  .layer:has(.nd.done)::after { border-color:var(--ok); }

/* 链路 DAG 并行分组：按 dependsOn 计算依赖层级，同层级多步骤即为并行波次 */
async function loadWaves(id) {

  try {
    const r = await fetch('/api/scene/sessions/' + id);
    const d = (await r.json()).data || {};
    const steps = d.steps || [];
    const byId = {}; steps.forEach(s => byId[s.stepId] = s);
    const lv = {};
    const level = sid => {
      if (lv[sid]) return lv[sid];
      const s = byId[sid]; if (!s) return 1;
      const deps = s.dependsOn || [];
      lv[sid] = 1 + (deps.length ? Math.max(...deps.map(level)) : 0);
      return lv[sid];
    };
    const waves = {};
    steps.forEach(s => {
      const l = level(s.stepId);
      (waves[l] = waves[l] || []).push(s);
    });
    renderDag(waves); /* 依赖分层即链路图分层，同层多步骤横排为并行波次 */
    /* 订阅前事件回填：chat 同步执行到确认节点时 SSE 尚未建立，将已推进步骤补成日志行，保证图形与日志一致可联动 */
    const STATE_LOG = { RUNNING:['START','执行中'], DONE:['DONE','完成'],
                        FAILED:['FAILED','执行失败'], SUSPENDED:['CONFIRM_REQUIRED','等待人工确认'] };
    Object.values(waves).flat().forEach(s => {
      const m = STATE_LOG[s.state];
      if (m) addLog({type: m[0], message: s.name + ' → ' + m[1], stepId: s.stepId});
    });
    stepWaves = {};
    Object.values(waves).forEach(ws => {
      if (ws.length < 2) return;
      const marks = ws.map(x => (String(x.name).match(/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⚑]+/) || [''])[0]).filter(Boolean);
      ws.forEach(s => stepWaves[s.stepId] = { key: 'w' + ws[0].stepId, size: ws.length, marks });
    });
  } catch (e) {}
}

};

/* ===== 历史对话：localStorage 本地留存，可回看可继续 ===== */
const HKEY = 'credit_chat_history';
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveHistory() {
  const userMsgs = [...chat.querySelectorAll('.row.user .msg')];
  if (!userMsgs.length) return;
  const html = chat.innerHTML;
  if (html.length > 300000) return; /* 超长对话不存，避免超出 localStorage 配额 */
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) {}
  const id = sessionId || ('local-' + Date.now());
  const title = userMsgs[0].textContent.slice(0, 40);
  /* 同一会话保留最新快照；首条消息与内容长度都相同的视为重复对话，仅保留最新 */
  const sig = title + '|' + html.length;
  arr = arr.filter(x => x.id !== id && (x.title + '|' + (x.html || '').length) !== sig);
  arr.unshift({ id, sessionId: sessionId || '', title, time: Date.now(), html });
  persistHistory(arr.slice(0, 20));
}
function persistHistory(arr) {
  /* 写入失败（超出配额）时自动丢弃最旧条目重试，保证删除/保存一定生效 */
  for (let i = 0; i < arr.length; i++) {
    try { localStorage.setItem(HKEY, JSON.stringify(arr.slice(i))); return; } catch (e) {}
  }
  try { localStorage.removeItem(HKEY); } catch (e) {}
}
function renderHistory() {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) {}
  const list = document.getElementById('histlist');
  list.innerHTML = '';
  if (!arr.length) { list.innerHTML = '<div class="hempty">暂无历史对话</div>'; return; }
  arr.forEach(item => {
    const d = document.createElement('div'); d.className = 'hitem';
    const dt = new Date(item.time);
    const tstr = dt.toDateString() === new Date().toDateString()
      ? '今天 ' + dt.toTimeString().slice(0, 8)
      : (dt.getMonth() + 1) + '-' + dt.getDate() + ' ' + dt.toTimeString().slice(0, 8);
    d.innerHTML = `<b>${escapeHtml(item.title)}</b><span>${tstr}</span>`;
    d.title = item.title;
    d.onclick = () => loadHistory(item);
    const del = document.createElement('button'); del.className = 'hdel'; del.title = '删除该对话';
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm('确定删除该历史对话？')) return;
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (x) {}
      arr = arr.filter(x => x.id !== item.id);
      persistHistory(arr);
      renderHistory();
    };
    d.appendChild(del);
    list.appendChild(d);
  });
}
function loadHistory(item) {
  saveHistory(); /* 若当前有未保存的对话，先存再切 */
  if (es) es.close();
  chat.innerHTML = item.html;
  sessionId = item.sessionId || null;
  if (sessionId) subscribe(sessionId); /* 续接会话：结果可继续追问确认 */
  document.body.classList.add('started');
  setState(null); setQuick([]);
  chat.scrollTop = chat.scrollHeight;
}
window.addEventListener('beforeunload', saveHistory);

(async function init() {
  renderHistory();
  try {
    const r = await fetch('/api/scene/scripts');
    const list = (await r.json()).data || [];
    const groups = {};
    SCRIPTS = {}; list.forEach(s => { SCRIPTS[s.sceneId] = s; const fam = s.sceneId.split('-')[0]; (groups[fam] = groups[fam] || []).push(s); });
    /* 数字越小越靠前（S1、S2…S12），符合信贷业务流程顺序 */
    const fams = Object.keys(groups).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
    const FAM_NAMES = { S1:'营销获客', S2:'申请受理', S3:'尽调评估', S4:'授信审批', S5:'合同签约',
                        S6:'放款用信', S7:'贷后管理', S8:'还款催收', S9:'核算报送', S10:'平台能力',
                        S11:'数据与AI底座', S12:'合规风控' };
    document.getElementById('scenes').textContent = `已接入 ${fams.length} 大场景族 · 共 ${list.length} 个场景，输入任意诉求将自动路由`;
    document.getElementById('topsub').textContent = `${fams.length} 大场景族 · ${list.length} 场景`;
    const fl = document.getElementById('famlist');
    fams.forEach(k => {
      const items = groups[k];
      const d = document.createElement('div'); d.className = 'fam';
      d.innerHTML = `<span class="fname">${FAM_NAMES[k] || k}</span><span class="n">${items.length}</span>`;
      d.title = items.map(s => `${s.sceneId} ${s.title}`).join('\n');
      const sub = document.createElement('div'); sub.className = 'sub';
      items.forEach(s => {
        const a = document.createElement('div'); a.className = 'subitem';
        a.innerHTML = `<i>${s.sceneId}</i><em>${s.title}</em>`;
        a.title = `${s.sceneId} ${s.title}`;
        a.onclick = e => {
          e.stopPropagation();
          if (!sessionId && !document.body.classList.contains('started')) {
            /* 场景入口引导：尚无进行中会话时，进入对话视图展示该场景开场白卡片（含典型问法按钮） */
            document.body.classList.add('started');
            addOpeningCard(SCRIPTS[s.sceneId] || s);
            input.focus();
          } else {
            /* 已有进行中对话：不打断，保持填入输入框 */
            input.value = `帮我办理「${s.title}」（${s.sceneId}）`; input.focus();
          }
        };
        sub.appendChild(a);
      });
      d.onclick = () => {
        const open = sub.style.display === 'block';
        sub.style.display = open ? 'none' : 'block';
        d.classList.toggle('open', !open);
      };
      fl.appendChild(d); fl.appendChild(sub);
    });
    /* 建议指令卡片 */
    const sugs = [
      ['生成还款计划', '用信申请 YS20261028013，逐期试算', '生成还款计划，用信申请 YS20261028013'],
      ['营销客群筛选', '房贷90天内到期客户，推荐经营贷并短信触达', '把名下房贷90天内到期的客户筛出来，推荐经营贷，发短信触达，先发300条'],
      ['押品价值重估', '对近期房产押品跑一轮重估', '跑一下押品重估'],
      ['客户画像查询', '看看宏远商贸的客户画像', '看看宏远商贸的客户画像'],
      ['授信申请受理', '受理宏远商贸的法人贷申请', '受理宏远商贸的法人贷申请'],
      ['今日待办与纪要', '我今天有哪些待办，记一下上午拜访纪要', '我今天有哪些待办，记一下上午拜访宏远商贸王总的纪要']
    ];
    sugs.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'sug'; b.style.animationDelay = (i * 60) + 'ms';
      b.innerHTML = `${s[0]}<span>${s[1]}</span>`;
      b.onclick = () => { input.value = s[2]; send(); };
      sugBox.appendChild(b);
    });
  } catch (x) {
    document.getElementById('scenes').textContent = '场景清单加载失败，请刷新重试';
  }
})();
</script>
