spring:
  application:
    name: image-agent
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8155
  servlet:
    context-path: /api/bai/image

# 引擎内核开关：mock=确定性仿真（联调回归基线）；real=SYS-01 质量明细（8101 /v1/quality）
bai:
  image:
    provider: ${BAI_IMAGE_PROVIDER:real}
    sys01:
      base-url: ${BAI_IMAGE_SYS01_URL:http://localhost:8101}
      timeout-ms: 30000

logging:
  level:
    com.bai.image: INFO
