spring:
  application:
    name: image-agent
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8155
  servlet:
    context-path: /api/bai/image

# 引擎内核开关：mock=确定性仿真（默认，联调回归基线）；real=统一 AI 推理网关
bai:
  image:
    provider: ${BAI_IMAGE_PROVIDER:mock}
    gateway:
      base-url: ${BAI_AI_GATEWAY_URL:http://localhost:9100}
      timeout-ms: 30000

logging:
  level:
    com.bai.image: INFO
