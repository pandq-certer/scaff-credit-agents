      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}

server:
  port: 8145
  servlet:
    context-path: /api/bai/compliance

logging:
  level:
    com.bai.compliance: INFO
