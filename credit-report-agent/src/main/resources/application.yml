spring:
  application:
    name: credit-report-agent
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}

server:
  port: 8110
  servlet:
    context-path: /api/bai/credit-report

logging:
  level:
    com.bai.creditreport: INFO
