spring:
  application:
    name: ocr-agent
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}

server:
  port: 8101
  servlet:
    context-path: /api/bai/ocr

# 引擎内核开关：mock=确定性仿真（联调回归基线）；real=SYS-01 智能文档处理服务（PaddleOCR 内核，数据不出行）
bai:
  ocr:
    provider: ${BAI_OCR_PROVIDER:real}
    sys01:
      base-url: ${BAI_OCR_SYS01_URL:http://localhost:8101}
      timeout-ms: 180000

logging:
  level:
    com.bai.ocr: INFO
